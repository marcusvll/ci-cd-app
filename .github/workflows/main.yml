# Define o nome do workflow na interface do GitHub
name: Fábrica de Software Automatizada - CI/CD

# Gatilhos que iniciam a execução do workflow
on:
  push:
    # O pipeline será acionado a cada push na branch 'main'
    branches:
      - main
  pull_request:
    # O pipeline será acionado a cada PR para a branch 'main'
    branches:
      - main
  workflow_dispatch: # Permite acionar o pipeline manualmente

# Define os jobs (etapas) do pipeline
jobs:
  # Job 1: Build da aplicação e execução de testes (Jest e Newman)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js (v20) e Cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Instalar dependências Node.js
        run: npm install

      - name: Executar testes unitários (Jest)
        run: npm test

      - name: Executar testes E2E (Newman)
        run: npm run test:e2e

  # Job 2: Análise de Qualidade de Código e Segurança (SAST) com SonarCloud
  sonarcloud-analysis:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: success()
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Executar Análise SonarCloud
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:

          projectKey: 'marcusvll_ci-cd-app'
          organization: 'marcusvll-1'

  # Job 3: Deploy da Imagem Docker (apenas na branch 'main')
  deploy-docker:
    runs-on: ubuntu-latest
    needs: [build-and-test, sonarcloud-analysis]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fazer Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir e Enviar Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Substitua 'ci-cd-app' pelo nome do seu repositório no Docker Hub
          tags: ${{ secrets.DOCKER_USERNAME }}/ci-cd-app:latest
